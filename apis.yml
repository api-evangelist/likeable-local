aid: likeable-local
name: Likeable Local
description: >-
  Likeable Local is a social media marketing company that now operates publicly as Storytellit —
  likeablelocal.com and www.likeablelocal.com both redirect to storytellit.com, while the product
  application at app.likeablelocal.com and app.storytellit.com still identifies itself as "Likeable
  Local" in its web app manifest. Storytellit sells social media management as a white-label service
  to digital agencies — strategy, custom content creation and publishing, paid social advertising,
  lead capture, and monthly performance reporting for the agency's clients, across verticals including
  dental, medical, legal, real estate, insurance, finance, eCommerce, and local business. The company
  is based in Portland, Maine, and was surfaced in the API Evangelist network as a 500 Global
  portfolio company. As of this enrichment pass Likeable Local / Storytellit publishes no public API,
  no developer portal, no API documentation, and no machine-readable specification; the public web
  surface is a four-page marketing site plus a private, login-gated React application.
